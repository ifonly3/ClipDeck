name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # The pinned image keeps a stable baseline; macos-latest surfaces toolchain
    # changes (for example SwiftPM resource bundle layouts) before they ship.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build release with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Run tests with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Validate packaging files
        run: |
          bash -n script/*.sh
          plutil -lint script/ClipDeck-Info.plist

      - name: Package and verify localized app bundle
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$(mktemp -d "${RUNNER_TEMP}/clipdeck-ci-package.XXXXXX")"
          APP_PATH="${PACKAGE_ROOT}/ClipDeck.app"
          ./script/package_app.sh release "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/ClipDeck"
          RESOURCE_BUNDLE="$APP_PATH/Contents/Resources/ClipDeck_ClipDeck.bundle"
          # SwiftPM's bundle layout and .lproj casing vary by toolchain.
          for LOCALIZATION in en zh-Hans; do
            test -n "$(find "$RESOURCE_BUNDLE" -ipath "*/$LOCALIZATION.lproj/Localizable.strings" -print -quit)"
            test -f "$APP_PATH/Contents/Resources/$LOCALIZATION.lproj/InfoPlist.strings"
          done
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
